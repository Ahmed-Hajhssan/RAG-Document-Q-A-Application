<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ask My Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="masthead">
    <h1>Ask My Docs</h1>
    <p class="tagline">Upload a document, then ask it anything.</p>
  </header>

  <p class="doc-status" id="docStatus"><span class="dot"></span>No document uploaded yet</p>

  <main class="thread" id="thread" aria-live="polite">
    <div class="msg agent">
      <div class="bubble">Hi — drop a document in with the paperclip and I'll read through it. Once it's in, ask me
        anything about it.</div>
    </div>
  </main>

  <form class="composer" id="composerForm">
    <div class="composer-row">
      <input type="file" id="fileInput">
      <button type="button" class="icon-btn" id="attachBtn" aria-label="Attach a document" title="Attach a document">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 015 5l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
        </svg>
      </button>
      <textarea id="question" rows="1" placeholder="Ask something about your document…"></textarea>
      <button type="submit" class="icon-btn send-btn" id="sendBtn" aria-label="Send question" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </form>

  <script src="script.js"></script>
</body>

</html>
